plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.aicontextpack.nativebridge'
version = '0.1.0'

android {
  namespace "com.aicontextpack.nativebridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  sourceSets {
    test.resources.srcDirs = [
      file("${rootProject.projectDir}/../fixtures/contracts"),
    ]
    androidTest.assets.srcDirs = [
      file("${rootProject.projectDir}/../fixtures/media"),
      file("${rootProject.projectDir}/../fixtures/contracts"),
    ]
  }
  testOptions {
    managedDevices {
      localDevices {
        ciApi34 {
          device = "Pixel 2"
          apiLevel = 34
          systemImageSource = "aosp"
          require64Bit = true
          testedAbi = "x86_64"
        }
        ciApi35 {
          device = "Pixel 2"
          apiLevel = 35
          systemImageSource = "aosp"
          require64Bit = true
          testedAbi = "x86_64"
        }
      }
    }
  }
}

// AGP 8.12 exposes testedAbi on the managed-device DSL but does not copy it into
// ManagedDeviceInstrumentationTestSetupTask. Keep both setup tasks pinned too,
// or AGP 9 will silently change these x86_64 CI devices to arm64-v8a.
tasks.matching { task -> ["ciApi34Setup", "ciApi35Setup"].contains(task.name) }.configureEach { task ->
  task.testedAbi.set("x86_64")
}

dependencies {
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
